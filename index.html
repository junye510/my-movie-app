
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#10131c">
<title>我的影视 App</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131c;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 padding-bottom:75px
}
header{
 padding:20px 16px 12px;
 display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:23px;font-weight:bold;color:#ffcc33}
header small{color:#929bb0}
.search{
 margin:8px 16px 15px;display:flex;gap:8px
}
.search input{
 flex:1;min-width:0;padding:13px;
 border:0;border-radius:12px;background:#252c3d;
 color:white;font-size:15px;outline:none
}
button{cursor:pointer}
.search button{
 border:0;border-radius:10px;padding:0 14px;
 background:#ffcc33;color:#171717;font-weight:bold
}
.section-title{
 margin:20px 16px 12px;font-size:17px;font-weight:bold
}
.categories{
 display:flex;gap:9px;padding:0 16px;
 overflow-x:auto;scrollbar-width:none
}
.categories button{
 flex-shrink:0;padding:10px 17px;border:0;
 border-radius:20px;background:#252c3d;color:#ddd
}
.categories button.active{
 background:#ffcc33;color:#151515;font-weight:bold
}
.banner{
 margin:18px 16px;padding:23px 18px;
 border-radius:16px;
 background:linear-gradient(120deg,#47351a,#252c3d);
}
.banner h2{margin:0 0 8px;color:#ffcc33}
.banner p{color:#d4d8e2;font-size:13px;line-height:1.6}
.banner button{
 background:#ffcc33;border:0;border-radius:20px;
 padding:10px 18px;font-weight:bold
}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;padding:0 16px
}
.movie{min-width:0;cursor:pointer}
.poster{
 width:100%;aspect-ratio:3/4;border-radius:12px;
 background:linear-gradient(145deg,#39435c,#202638);
 display:flex;align-items:center;justify-content:center;
 font-size:55px;overflow:hidden;position:relative
}
.poster img{width:100%;height:100%;object-fit:cover}
.movie h3{
 font-size:14px;margin:9px 0 5px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.movie p{font-size:12px;color:#9da8bc;margin:0}
.empty{
 text-align:center;color:#9da8bc;padding:45px 15px;
 display:none
}
.page{display:none}
.page.active{display:block}
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;
 height:65px;background:#191f2d;
 display:flex;justify-content:space-around;
 border-top:1px solid #30384b;z-index:5
}
.bottom-nav button{
 flex:1;background:none;border:0;color:#9da8bc;
 font-size:12px
}
.bottom-nav button.active{color:#ffcc33}
.bottom-nav span{display:block;font-size:21px;margin-bottom:3px}
.detail{padding:16px}
.detail-poster{
 width:100%;height:230px;border-radius:15px;
 background:#252c3d;display:flex;align-items:center;
 justify-content:center;font-size:65px;overflow:hidden
}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail h2{margin-bottom:8px}
.muted{color:#a3aec2;font-size:13px;line-height:1.7}
.action-row{display:flex;gap:10px;margin:18px 0}
.action-row button{
 flex:1;padding:13px;border:0;border-radius:10px;
 background:#ffcc33;color:#171717;font-weight:bold
}
.action-row button.secondary{
 background:#30384b;color:white
}
.player{
 width:100%;background:#000;border-radius:12px;
 overflow:hidden;aspect-ratio:16/9;margin:15px 0
}
.player video{width:100%;height:100%}
.url-input{
 width:100%;padding:12px;border:0;border-radius:9px;
 background:#252c3d;color:white;margin:8px 0
}
.primary{
 width:100%;padding:13px;border:0;border-radius:10px;
 background:#ffcc33;color:#171717;font-weight:bold
}
.back{
 border:0;background:#252c3d;color:white;
 padding:10px 15px;border-radius:9px;margin-bottom:15px
}
footer{text-align:center;color:#737e94;font-size:11px;padding:25px}
</style>
</head>

<body>

<header>
 <div class="logo">🎬 我的影视</div>
 <small>影视探索空间</small>
</header>

<div class="search">
 <input id="searchInput" placeholder="搜索电影、电视剧、动漫...">
 <button onclick="clearSearch()">清空</button>
</div>

<main>
<section id="homePage" class="page active">

 <div class="banner">
  <h2>发现精彩影视</h2>
  <p>电影 · 电视剧 · 动漫 · 综艺<br>
  创建属于自己的影视收藏空间。</p>
  <button onclick="showCategory('电影')">探索电影</button>
 </div>

 <div class="section-title">影视分类</div>
 <div class="categories" id="categories">
  <button class="active" data-category="全部">全部</button>
  <button data-category="电影">电影</button>
  <button data-category="电视剧">电视剧</button>
  <button data-category="动漫">动漫</button>
  <button data-category="综艺">综艺</button>
 </div>

 <div class="section-title" id="listTitle">全部影视</div>
 <div class="grid" id="movieGrid"></div>
 <div class="empty" id="empty">没有找到相关影视内容</div>
 <footer>我的影视 App · 个人学习项目</footer>
</section>

<section id="detailPage" class="page">
 <div class="detail">
  <button class="back" onclick="goHome()">← 返回首页</button>
  <div class="detail-poster" id="detailPoster">🎬</div>
  <h2 id="detailTitle"></h2>
  <div class="muted" id="detailMeta"></div>
  <p id="detailDesc" class="muted"></p>
  <div class="action-row">
   <button onclick="openPlayer()">▶ 播放</button>
   <button class="secondary" id="favoriteButton" onclick="toggleFavorite()">☆ 收藏</button>
  </div>
  <p class="muted">提示：播放功能需要你提供合法授权的视频地址。</p>
 </div>
</section>

<section id="playerPage" class="page">
 <div class="detail">
  <button class="back" onclick="showPage('detailPage')">← 返回详情</button>
  <h2 id="playerTitle">影视播放</h2>
  <div class="player">
   <video id="videoPlayer" controls playsinline></video>
  </div>
  <p class="muted">输入你拥有播放授权的视频文件地址。</p>
  <input class="url-input" id="videoUrl"
   placeholder="粘贴授权视频 MP4 地址">
  <button class="primary" onclick="loadVideo()">加载视频</button>
  <p class="muted" id="playerMessage"></p>
 </div>
</section>

<section id="favoritePage" class="page">
 <div class="section-title">⭐ 我的收藏</div>
 <div class="grid" id="favoriteGrid"></div>
 <div class="empty" id="favoriteEmpty">还没有收藏影视</div>
</section>

<section id="historyPage" class="page">
 <div class="section-title">🕒 观看历史</div>
 <div class="grid" id="historyGrid"></div>
 <div class="empty" id="historyEmpty">还没有观看记录</div>
</section>
</main>

<nav class="bottom-nav">
 <button class="active" data-page="homePage">
  <span>🏠</span>首页
 </button>
 <button data-page="favoritePage">
  <span>⭐</span>收藏
 </button>
 <button data-page="historyPage">
  <span>🕒</span>历史
 </button>
</nav>

<script>
const movies = [
 {
  id:1,title:"电影示例一",category:"电影",
  icon:"🎥",year:"2026",genre:"动作",
  desc:"这是电影演示内容。你可以在后续版本中添加真实的影视信息、封面和合法播放地址。"
 },
 {
  id:2,title:"科幻电影示例",category:"电影",
  icon:"🚀",year:"2026",genre:"科幻",
  desc:"科幻电影演示内容，展示影视详情页面。"
 },
 {
  id:3,title:"电视剧示例一",category:"电视剧",
  icon:"📺",year:"2026",genre:"剧情",
  desc:"这是电视剧演示内容。"
 },
 {
  id:4,title:"动漫示例一",category:"动漫",
  icon:"🍥",year:"2026",genre:"动画",
  desc:"这是动漫演示内容。"
 },
 {
  id:5,title:"综艺节目示例",category:"综艺",
  icon:"🎤",year:"2026",genre:"娱乐",
  desc:"这是综艺演示内容。"
 },
 {
  id:6,title:"冒险动画示例",category:"动漫",
  icon:"🌟",year:"2026",genre:"冒险",
  desc:"这是冒险动画演示内容。"
 },
 {
  id:7,title:"爱情电视剧示例",category:"电视剧",
  icon:"❤️",year:"2026",genre:"爱情",
  desc:"这是爱情电视剧演示内容。"
 },
 {
  id:8,title:"喜剧电影示例",category:"电影",
  icon:"😂",year:"2026",genre:"喜剧",
  desc:"这是喜剧电影演示内容。"
 }
];

let currentCategory="全部";
let currentMovie=null;

let favorites=JSON.parse(
 localStorage.getItem("movieFavorites")||"[]"
);
let history=JSON.parse(
 localStorage.getItem("movieHistory")||"[]"
);

const searchInput=document.getElementById("searchInput");

function saveData(){
 localStorage.setItem("movieFavorites",JSON.stringify(favorites));
 localStorage.setItem("movieHistory",JSON.stringify(history));
}

function posterHTML(movie){
 return `<div class="poster">${movie.icon}</div>`;
}

function movieHTML(movie){
 return `
 <div class="movie" onclick="openDetail(${movie.id})">
  ${posterHTML(movie)}
  <h3>${escapeHTML(movie.title)}</h3>
  <p>${escapeHTML(movie.category)} · ${escapeHTML(movie.genre)}</p>
 </div>`;
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function renderHome(){
 const keyword=searchInput.value.trim().toLowerCase();

 const list=movies.filter(movie=>{
  const categoryOK=currentCategory==="全部"||
   movie.category===currentCategory;
  const searchOK=(movie.title+" "+movie.category+
   " "+movie.genre+" "+movie.desc).toLowerCase()
   .includes(keyword);
  return categoryOK&&searchOK;
 });

 document.getElementById("movieGrid").innerHTML=
  list.map(movieHTML).join("");

 document.getElementById("empty").style.display=
  list.length?"none":"block";

 document.getElementById("listTitle").textContent=
  currentCategory==="全部"?"全部影视":currentCategory;
}

function showCategory(category){
 currentCategory=category;
 document.querySelectorAll(".categories button").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.category===category);
 });
 showPage("homePage");
 renderHome();
}

document.querySelectorAll(".categories button").forEach(btn=>{
 btn.addEventListener("click",()=>{
  showCategory(btn.dataset.category);
 });
});

searchInput.addEventListener("input",renderHome);

function clearSearch(){
 searchInput.value="";
 renderHome();
}

function showPage(id){
 document.querySelectorAll(".page").forEach(page=>{
  page.classList.remove("active");
 });
 document.getElementById(id).classList.add("active");

 document.querySelectorAll(".bottom-nav button").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.page===id);
 });

 searchInput.style.display=
  id==="homePage"?"block":"none";

 document.querySelector(".search").style.display=
  id==="homePage"?"flex":"none";

 if(id==="favoritePage")renderFavorites();
 if(id==="historyPage")renderHistory();
}

document.querySelectorAll(".bottom-nav button").forEach(btn=>{
 btn.addEventListener("click",()=>showPage(btn.dataset.page));
});

function openDetail(id){
 currentMovie=movies.find(movie=>movie.id===id);
 if(!currentMovie)return;

 document.getElementById("detailPoster").innerHTML=
  currentMovie.icon;

 document.getElementById("detailTitle").textContent=
  currentMovie.title;

 document.getElementById("detailMeta").textContent=
  currentMovie.category+" · "+currentMovie.year+
  " · "+currentMovie.genre;

 document.getElementById("detailDesc").textContent=
  currentMovie.desc;

 updateFavoriteButton();
 showPage("detailPage");
}

function goHome(){
 showPage("homePage");
}

function updateFavoriteButton(){
 const saved=favorites.includes(currentMovie.id);
 const button=document.getElementById("favoriteButton");
 button.textContent=saved?"★ 已收藏":"☆ 收藏";
}

function toggleFavorite(){
 if(!currentMovie)return;

 if(favorites.includes(currentMovie.id)){
  favorites=favorites.filter(id=>id!==currentMovie.id);
 }else{
  favorites.push(currentMovie.id);
 }

 saveData();
 updateFavoriteButton();
}

function renderFavorites(){
 const list=movies.filter(movie=>favorites.includes(movie.id));
 document.getElementById("favoriteGrid").innerHTML=
  list.map(movieHTML).join("");
 document.getElementById("favoriteEmpty").style.display=
  list.length?"none":"block";
}

function renderHistory(){
 const list=history.map(id=>movies.find(movie=>movie.id===id))
  .filter(Boolean);
 document.getElementById("historyGrid").innerHTML=
  list.map(movieHTML).join("");
 document.getElementById("historyEmpty").style.display=
  list.length?"none":"block";
}

function openPlayer(){
 if(!currentMovie)return;

 history=history.filter(id=>id!==currentMovie.id);
 history.unshift(currentMovie.id);
 history=history.slice(0,50);
 saveData();

 document.getElementById("playerTitle").textContent=
  currentMovie.title;

 document.getElementById("videoUrl").value="";
 document.getElementById("playerMessage").textContent=
  "请输入拥有授权的视频地址后加载。";

 showPage("playerPage");
}

function loadVideo(){
 const url=document.getElementById("videoUrl").value.trim();
 const video=document.getElementById("videoPlayer");
 const message=document.getElementById("playerMessage");

 if(!url){
  message.textContent="请先输入视频地址。";
  return;
 }

 try{
  const parsed=new URL(url);
  if(parsed.protocol!=="https:"&&parsed.protocol!=="http:"){
   throw new Error("invalid protocol");
  }
 }catch(e){
  message.textContent="视频地址格式不正确。";
  return;
 }

 video.src=url;
 video.load();
 message.textContent=
  "视频地址已加载。如果无法播放，请确认地址有效且支持浏览器播放。";
}

renderHome();
</script>

</body>
</html>
