
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的影视 App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #ffcc33;
      text-align: center;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .categories button {
      flex: 1;
      padding: 12px 5px;
      border: 0;
      border-radius: 8px;
      background: #292f40;
      color: white;
    }

    .categories button:focus {
      background: #e6a800;
      color: black;
    }

    .card {
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: #202638;
    }

    .card h3 {
      margin-top: 0;
    }

    .note {
      color: #aeb7ca;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h1>🎬 我的影视 App</h1>

  <input
    class="search"
    type="text"
    placeholder="搜索电影、电视剧、动漫..."
    id="search"
  >

  <div class="categories">
    <button onclick="showCategory('全部')">全部</button>
    <button onclick="showCategory('电影')">电影</button>
    <button onclick="showCategory('电视剧')">电视剧</button>
    <button onclick="showCategory('动漫')">动漫</button>
  </div>

  <div id="movies">
    <div class="card" data-category="电影">
      <h3>🎥 电影专区</h3>
      <p>这里将展示电影内容。</p>
    </div>

    <div class="card" data-category="电视剧">
      <h3>📺 电视剧专区</h3>
      <p>这里将展示电视剧内容。</p>
    </div>

    <div class="card" data-category="动漫">
      <h3>🍥 动漫专区</h3>
      <p>这里将展示动漫内容。</p>
    </div>
  </div>

  <p class="note">
    我的第一个影视 App · 正在学习制作中
  </p>

  <script>
    function showCategory(category) {
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        card.style.display =
          category === '全部' ||
          card.dataset.category === category
            ? 'block'
            : 'none';
      });
    }

    document.getElementById('search')
      .addEventListener('input', function() {
        const keyword = this.value.toLowerCase();

        document.querySelectorAll('.card')
          .forEach(card => {
            card.style.display =
              card.innerText.toLowerCase().includes(keyword)
                ? 'block'
                : 'none';
          });
      });
  </script>

</body>
</html>
